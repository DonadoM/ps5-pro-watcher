name: PS5 Pro price watch

on:
  schedule:
    # Cada 3 horas en punto UTC. GitHub programa best-effort, puede haber retraso.
    - cron: '0 */3 * * *'
  workflow_dispatch:  # boton "Run workflow" en la UI

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write  # para commit del state.json actualizado

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD_COP: ${{ vars.THRESHOLD_COP }}
        run: python watcher.py

      - name: Update price chart
        run: python chart.py

      - name: Commit state and history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json data/ docs/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
